baseURL = 'https://liyuu1ove.github.io'
theme = 'PaperMod'

defaultContentLanguage = 'zh'
defaultContentLanguageInSubdir = false

[markup.highlight]
  noClasses = false

[params]
  defaultTheme = 'light'
  disableThemeToggle = false
  displayFullLangName = true
  mainSections = ['technical-blog', 'essays']

[outputs]
  home = ['HTML', 'RSS', 'JSON']

# ==================== 中文配置 (zh) ====================
[languages.zh]
  languageCode = 'zh-cn'
  languageName = '简体中文'
  title = '鲤鱼爱的神秘小屋'
  weight = 1

  [languages.zh.params]
    env = 'production'
    description = '个人主页、论文、技术博客与随笔'
