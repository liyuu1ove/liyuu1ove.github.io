<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var forcedTheme = params.get("theme");
    var exportMode = params.get("export");
    if (forcedTheme === "dark" || forcedTheme === "light") {
      document.documentElement.dataset.theme = forcedTheme;
      localStorage.setItem("pref-theme", forcedTheme);
    }
    if (exportMode) {
      document.documentElement.dataset.export = exportMode;
      document.body && document.body.classList.add("export-" + exportMode);
    }
  })();
</script>
